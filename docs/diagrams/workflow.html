<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clickup-gh-workflow · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif Thai', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · clickup-gh-workflow</p>
    <h1>จากสเปก Markdown ถึง PR ที่พร้อมรีวิว</h1>

    <div class="scroll">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc">
      <title id="workflow-title">How clickup-gh-workflow delivers a spec</title>
      <desc id="workflow-desc">A spec written locally becomes a ClickUp card through a GitHub Actions worker that holds the ClickUp token, then moves through a branch with a failing RED test, human approval, GREEN evidence and a ready pull request whose state is synced back to ClickUp.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lane dividers -->
      <line x1="32" y1="40" x2="928" y2="40" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="32" y1="144" x2="928" y2="144" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="32" y1="248" x2="928" y2="248" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="32" y1="376" x2="928" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="32" y1="480" x2="928" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="152" y1="40" x2="152" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="44" y="99" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLICKUP</text>
      <text x="44" y="199" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GITHUB ACTIONS</text>
      <text x="44" y="315" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">YOU / AI</text>
      <text x="44" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em" opacity="0.8">LOCAL TERMINAL</text>
      <text x="44" y="431" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GITHUB PR</text>

      <!-- Arrows (drawn first) -->
      <!-- Spec → worker (create) -->
      <line x1="228" y1="288" x2="228" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Worker → card -->
      <line x1="228" y1="172" x2="228" y2="122" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Spec → RED (start) -->
      <line x1="288" y1="312" x2="330" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- RED → approve (human gate) -->
      <line x1="452" y1="312" x2="494" y2="312" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Approve → GREEN -->
      <line x1="616" y1="312" x2="658" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- RED → Draft PR -->
      <line x1="392" y1="336" x2="392" y2="402" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Draft PR → PR ready (same PR, new state) -->
      <line x1="452" y1="428" x2="810" y2="428" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- GREEN → PR ready -->
      <path d="M 780,312 H 840 Q 848,312 848,320 V 402" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- PR ready → worker (pr sync) -->
      <line x1="888" y1="404" x2="888" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Worker → status -->
      <line x1="888" y1="172" x2="888" y2="122" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="238" y="250" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CREATE</text>

      <rect x="290" y="292" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">START</text>

      <rect x="452" y="292" width="42" height="12" rx="2" fill="#f5f5f5"/>
      <text x="473" y="301" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">VERIFY</text>

      <rect x="402" y="352" width="50" height="12" rx="2" fill="#f5f5f5"/>
      <text x="427" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PR OPEN</text>

      <rect x="604" y="408" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SAME PR</text>

      <rect x="798" y="348" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="818" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">READY</text>

      <rect x="828" y="230" width="50" height="12" rx="2" fill="#f5f5f5"/>
      <text x="853" y="239" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PR SYNC</text>

      <!-- Nodes -->
      <!-- ClickUp: card -->
      <rect x="168" y="72" width="120" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="228" y="94" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Card + subtasks</text>
      <text x="228" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">estimate · priority</text>

      <!-- ClickUp: status -->
      <rect x="812" y="72" width="112" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="868" y="94" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Status synced</text>
      <text x="868" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">in review · PR link</text>

      <!-- Actions: worker (token boundary) -->
      <rect x="168" y="172" width="756" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="546" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Actions worker on your fork</text>
      <text x="546" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">worker.py · secret CLICKUP_API_TOKEN · token never touches your machine</text>

      <!-- Local: spec -->
      <rect x="168" y="288" width="120" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="228" y="310" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write spec</text>
      <text x="228" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">*-spec.md</text>

      <!-- Local: branch + RED -->
      <rect x="332" y="288" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="392" y="310" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Branch + RED</text>
      <text x="392" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">check --phase red</text>

      <!-- Local: human approves RED (focal) -->
      <rect x="496" y="288" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="556" y="310" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human OKs RED</text>
      <text x="556" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">approve-red</text>

      <!-- Local: GREEN -->
      <rect x="660" y="288" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="310" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GREEN evidence</text>
      <text x="720" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">test · lint · build</text>

      <!-- PR: draft -->
      <rect x="332" y="404" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="392" y="426" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft PR</text>
      <text x="392" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ClickUp-Task trailer</text>

      <!-- PR: ready -->
      <rect x="812" y="404" width="112" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="868" y="426" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PR ready</text>
      <text x="868" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CI green · no merge</text>

      <!-- Legend -->
      <line x1="32" y1="512" x2="928" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="552" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="52" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Your input</text>

      <rect x="124" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">CLI step</text>

      <rect x="208" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="228" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">ClickUp record</text>

      <rect x="316" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="336" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Token boundary</text>

      <rect x="428" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="448" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Human gate</text>

      <line x1="524" y1="557" x2="552" y2="557" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="560" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Command / handoff</text>

      <line x1="676" y1="557" x2="704" y2="557" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="712" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Same PR, new state</text>
    </svg>
    </div>
  </div>
</body>
</html>
