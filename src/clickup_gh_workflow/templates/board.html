<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#16181d;--muted:#5d6470;--line:#d9dde3;--soft:#eef0f3;
  --edge-ok:#16a34a;--edge-wait:#9aa1ab;--alert:#dc2626;--link:#2563eb;--shadow:0 12px 40px rgba(0,0,0,.18);
  --s-backlog:#6b7280;--s-ready:#15803d;--s-progress:#1d4ed8;--s-review:#7c3aed;
  --s-rework:#c2410c;--s-merge:#0f766e;--s-testing:#be185d;--s-done:#065f46;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a20;--ink:#e8eaee;--muted:#9aa1ab;--line:#2a2f38;--soft:#1f232b;
  --edge-wait:#5d6470;--link:#7aa2ff;--shadow:0 12px 40px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#171a20;--ink:#e8eaee;--muted:#9aa1ab;--line:#2a2f38;--soft:#1f232b;--edge-wait:#5d6470;--link:#7aa2ff;--shadow:0 12px 40px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
a{color:inherit;text-decoration:none}
header{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding:14px 24px 8px}
h1{font-size:19px;margin:0;font-weight:600;display:inline}
.sub{color:var(--muted);font-size:13px;margin-left:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.legend .st{padding:1px 9px;border-radius:99px;color:#fff}
.legend .k{display:inline-flex;align-items:center;gap:5px;margin-left:8px}
.legend svg{width:26px;height:8px}
.box{width:14px;height:10px;border-radius:3px;outline:2px solid #22c55e;outline-offset:1px}
button.theme{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;padding:0 24px 10px}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-right:8px}
.tabs button{border:0;background:var(--panel);color:var(--muted);font:inherit;font-weight:600;padding:6px 16px;cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.summary button{background:var(--panel);color:var(--ink);font:inherit;border:1px solid var(--line);border-radius:10px;padding:5px 12px;display:flex;align-items:center;cursor:pointer}
.summary button:hover{border-color:var(--muted)}
.summary button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.faded{opacity:.15}
.late{white-space:nowrap;background:#fde047;color:#1f2937;border-radius:4px;padding:0 4px;font-weight:600}
.summary b{font-size:18px;margin-right:6px}
main{flex:1;min-height:0;margin:0 24px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
[hidden]{display:none!important}
#stage{position:absolute;inset:12px 14px}
#board{position:absolute;top:0;left:0;transform-origin:0 0}
.lane{display:grid;grid-template-columns:120px auto;border-top:1px solid var(--soft);padding:10px 0}
.lane:first-of-type{border-top:0;padding-top:4px}
.lane-name{color:var(--muted);font-weight:600;font-size:12.5px;padding-right:10px}
.lane-name .ico{color:var(--link);font-size:11.5px;font-weight:500;margin-bottom:2px}
.lane-grid{display:grid;grid-template-columns:repeat(var(--cols),204px);column-gap:40px;row-gap:10px}
.card{position:relative;width:204px;min-height:96px;border-radius:11px;padding:8px 10px;color:#fff;display:flex;flex-direction:column;gap:4px;transition:transform .12s,box-shadow .12s,opacity .12s;z-index:1}
.card .top,.card .bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .title{font-weight:500;font-size:13px;line-height:1.3;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pill{background:rgba(255,255,255,.2);border-radius:99px;padding:0 8px;font-size:11.5px;white-space:nowrap}
.card .turn{font-size:11.5px;text-align:right}
.card{cursor:pointer}
.ico{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:0 3px;margin:0 -3px}
.ico:hover{background:rgba(127,127,127,.25);text-decoration:underline}
.ico svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.big{font-size:14px;font-weight:600}.ico.big svg{width:15px;height:15px}
.chip.ico{margin:0;padding:0 6px}
.badge-new{position:absolute;top:-8px;right:-8px;background:var(--alert);color:#fff;border:2px solid var(--panel);border-radius:99px;padding:0 7px;font-size:11px;font-weight:600;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(220,38,38,.25)}}
.startable{outline:3px solid #22c55e;outline-offset:2px}
.dim{opacity:.22}
#g-deps path.dim{opacity:.08}
.hot{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.s-backlog{background:var(--s-backlog)}.s-ready{background:var(--s-ready)}.s-progress{background:var(--s-progress)}
.s-review{background:var(--s-review)}.s-rework{background:var(--s-rework)}.s-merge{background:var(--s-merge)}.s-testing{background:var(--s-testing)}.s-done{background:var(--s-done)}
svg#edges{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible}
#github{position:absolute;inset:0;overflow:auto;padding:14px 16px}
.prs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pr{border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:12px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.pr.OPEN{border-left-color:#16a34a}.pr.DRAFT{border-left-color:#9aa1ab}.pr.MERGED{border-left-color:#7c3aed}.pr.CLOSED{border-left-color:#dc2626}
.pr .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.state{font-size:12px;border-radius:99px;padding:1px 8px;color:#fff}
.state.OPEN{background:#16a34a}.state.DRAFT{background:#6b7280}.state.MERGED{background:#7c3aed}.state.CLOSED{background:#dc2626}
.row{font-size:12.5px;color:var(--muted)}
.ok{color:#16a34a}.bad{color:var(--alert)}
.lead{background:var(--soft);border-radius:8px;padding:6px 8px;font-size:12.5px}
details summary{cursor:pointer;font-size:12.5px}
details ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--link)}
.closed-list{margin-top:14px}
#peek{position:fixed;top:16px;right:16px;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:hidden;display:flex;flex-direction:column;gap:10px;z-index:10;pointer-events:none}
#peek .pr,#peek .note{box-shadow:var(--shadow)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.note h3{margin:0 0 4px;font-size:13px}
.note.new{border-color:var(--alert)}
@media (max-width:700px){header,.bar{padding-left:16px;padding-right:16px}main{margin:0 16px 16px}}
</style>
</head>
<body>
<header>
  <div><h1>Delivery Board</h1><span class="sub" id="meta"></span></div>
  <div class="legend" id="legend"></div>
  <button class="theme" id="theme">สลับธีม</button>
</header>
<div class="bar">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="clickup" id="t-clickup">ClickUp</button>
    <button role="tab" aria-selected="false" data-tab="github" id="t-github">GitHub</button>
  </div>
  <div class="summary" id="summary"></div>
</div>
<main>
  <div id="clickup"><div id="stage"><div id="board">
    <svg id="edges"><defs>
      <marker id="a-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="var(--edge-ok)"/></marker>
      <marker id="a-wait" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="var(--edge-wait)"/></marker>
    </defs><g id="g-deps"></g></svg>
    <div id="lanes"></div>
  </div></div></div>
  <div id="github" hidden>
    <div class="prs" id="prs"></div>
    <details class="closed-list"><summary id="closed-sum"></summary><div class="prs" id="prs-closed" style="margin-top:12px"></div></details>
  </div>
</main>
<div id="peek" hidden></div>
<script>
const D = /*DATA*/null;
// roles come from [statuses] in .clickup-workflow.toml; any other status (testing, done...) is "later"
const CLS = {backlog:'s-backlog',ready:'s-ready',in_progress:'s-progress',in_review:'s-review',rework:'s-rework',approved:'s-merge',later:'s-testing'};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(D.cards.map(c => [c.id, c]));
const prBy = Object.fromEntries(D.prs.map(p => [p.n, p]));
const ICON_CARD = '<svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3"/><path d="M5 8.2l2 2 4-4.4"/></svg>';
const ICON_PR = '<svg viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.8"/><circle cx="4" cy="12.5" r="1.8"/><circle cx="12" cy="12.5" r="1.8"/><path d="M4 5.3v5.4M12 10.7V6.5a2 2 0 0 0-2-2H7.5M9 3L7.5 4.5 9 6"/></svg>';
const cardLink = (c, chip) => `<a class="ico mono${chip ? ' chip' : ''}" href="${esc(c.url)}" target="_blank" title="เปิด ${c.id} ใน ClickUp">${ICON_CARD}${c.id}${chip ? ' ' + c.spec : ''}</a>`;
const prLink = (p, big) => `<a class="ico mono${big ? ' big' : ''}" href="${esc(p.url)}" target="_blank" title="เปิด PR #${p.n} บน GitHub">${ICON_PR}#${p.n}</a>`;
const isDone = id => !!byId[id]?.passed;  // past review in ClickUp, or its PR merged

// Lead's turn: reviewing, opening a startable backlog card, or merging a card past review (e.g. "ready to merge")
const leadTurn = c => c.role === 'in_review' || (c.role === 'backlog' && c.deps_done) || c.role === 'approved';
const myTurn = c => ['ready','in_progress','rework'].includes(c.role);
// days since the ball went to the Lead (my first comment after the Lead last spoke); counted at view time
const waitDays = c => leadTurn(c) && c.waiting_since ? Math.floor((Date.now() - c.waiting_since) / 864e5) : null;
const waitTag = c => { const d = waitDays(c); return d == null ? '' : ` · <span class="${d >= 3 ? 'late' : ''}">${d ? 'รอ ' + d + ' วัน' : 'วันนี้'}</span>`; };
function turn(c){
  if (c.role === 'backlog') {
    if (!c.deps_done) { const w = c.deps.find(d => !isDone(d)); return 'รอ ' + (byId[w]?.spec || w); }
    return 'รอหัวหน้าเปิด ready' + waitTag(c);
  }
  if (c.role === 'in_review') return 'รอหัวหน้ารีวิว' + waitTag(c);
  return {ready:'ตาคุณ · เริ่มได้',in_progress:'ตาคุณ',rework:'ตาคุณ · แก้งาน'}[c.role]
    || (c.role === 'approved' ? 'รอ merge' + waitTag(c) : /test|qa/i.test(c.status) ? 'QA / หัวหน้า' : 'เสร็จแล้ว');
}

$('meta').textContent = `${D.repo} · ดึงข้อมูล ${D.generated}`;
$('legend').innerHTML = D.statuses.map(s => `<span class="st ${CLS[s.role]}">${esc(cap(s.name))}</span>`).join('') +
  `<span class="k"><svg><line x1="0" y1="4" x2="26" y2="4" stroke="var(--edge-ok)" stroke-width="2"/></svg>เสร็จแล้ว</span>
   <span class="k"><svg><line x1="0" y1="4" x2="26" y2="4" stroke="var(--edge-wait)" stroke-width="2" stroke-dasharray="4 4"/></svg>ยังรอ</span>
   <span class="k"><span class="box"></span>เริ่มได้</span>
   <span class="k"><span class="bad">●</span>หัวหน้าตอบใหม่</span>`;

const openPrs = D.prs.filter(p => p.state === 'OPEN' || p.state === 'DRAFT');
// summary chips: card chips filter the board, PR chips open the GitHub tab
const FILTERS = {me: myTurn, lead: leadTurn, new: c => c.lead_new};
$('summary').innerHTML = [
  ['me', D.cards.filter(myTurn).length, 'ตาคุณ'],
  ['lead', D.cards.filter(leadTurn).length, 'รอหัวหน้า'],
  ['new', D.cards.filter(c => c.lead_new).length, '<span class="bad">ข้อความใหม่จากหัวหน้า</span>'],
  ['gh', openPrs.length, 'PR เปิดอยู่'],
  ['gh', D.prs.filter(p => p.state !== 'CLOSED').reduce((n, p) => n + p.threads.filter(t => !t.resolved).length, 0), 'คอมเมนต์ใน PR ที่ยังไม่ resolve'],
].map(([f, n, l]) => `<button data-f="${f}" aria-pressed="false"><b>${n}</b>${l}</button>`).join('');
let filter = null;
function applyFilter(){
  const ok = FILTERS[filter];
  document.querySelectorAll('[data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filter));
  D.cards.forEach(c => $('c-' + c.id).classList.toggle('faded', !!ok && !ok(c)));
  document.querySelectorAll('#g-deps path').forEach(p => p.classList.toggle('faded', !!ok && !(ok(byId[p.dataset.from]) || ok(byId[p.dataset.to]))));
}
$('t-clickup').textContent = `ClickUp ${D.cards.length}`;
$('t-github').textContent = `GitHub ${openPrs.length}`;

// column = longest chain of dependencies inside the same lane; cross-lane deps are drawn, not counted
const depth = {};
const dep = id => depth[id] ?? (depth[id] = 0, depth[id] = Math.max(0, ...byId[id].deps.filter(d => byId[d]?.group === byId[id].group).map(d => dep(d) + 1)));
D.cards.forEach(c => dep(c.id));
const cols = Math.max(...Object.values(depth)) + 1;
const lanes = {};
D.cards.forEach(c => (lanes[c.group] ??= []).push(c));
// lane rank: a lane sits below every lane it waits on
const rank = {};
const laneRank = (g, seen = new Set()) => rank[g] ?? (seen.has(g) ? 0 : (seen.add(g), rank[g] = Math.max(0, ...lanes[g].flatMap(c => c.deps)
  .map(d => byId[d]?.group).filter(x => x && x !== g).map(x => laneRank(x, seen) + 1))));
const laneOrder = Object.keys(lanes).sort((a, b) => laneRank(a) - laneRank(b) || a.localeCompare(b));

$('lanes').innerHTML = laneOrder.map(g => {
  const used = {};
  const cards = lanes[g].sort((a, b) => depth[a.id] - depth[b.id] || a.spec.localeCompare(b.spec)).map(c => {
    const col = depth[c.id] + 1, row = (used[col] = (used[col] || 0) + 1);
    const canStart = ['backlog','ready'].includes(c.role) && c.deps_done;
    return `<div class="card ${CLS[c.role]}${canStart ? ' startable' : ''}" id="c-${c.id}" data-card="${c.id}" data-url="${esc(c.url)}" style="grid-column:${col};grid-row:${row}">
      ${c.lead_new ? '<span class="badge-new">ใหม่</span>' : ''}
      <div class="top">${cardLink(c)}<span class="mono">${c.spec}</span></div>
      <div class="title">${esc(c.title)}</div>
      <div class="bot"><span class="pill">${esc(cap(c.status))}</span><span class="turn">${c.prs.map(n => prLink(prBy[n])).join(' ')}${c.prs.length ? ' · ' : ''}${turn(c)}</span></div></div>`;
  }).join('');
  const gl = lanes[g][0].group_link;
  return `<div class="lane"><div class="lane-name">${gl ? `<a class="ico mono" href="${esc(gl.url)}" target="_blank" title="เปิด main task ${gl.id} ใน ClickUp">${ICON_CARD}${gl.id}</a><br>` : ''}${esc(g.replace(/^\[[^\]]+\]\s*/, ''))}</div><div class="lane-grid" style="--cols:${cols}">${cards}</div></div>`;
}).join('');

// PR cards (GitHub tab and the hover peek share one renderer)
const prCard = p => {
  const open = p.threads.filter(t => !t.resolved), fixed = p.threads.filter(t => t.resolved);
  const checks = Object.entries(p.checks).map(([k, v]) => `<span class="${v === 'SUCCESS' ? 'ok' : v ? 'bad' : ''}">${v === 'SUCCESS' ? '✓' : '✗'} ${esc(k)}</span>`).join(' · ') || 'ไม่มี check';
  const rv = {APPROVED:'<span class="ok">Approved</span>',CHANGES_REQUESTED:'<span class="bad">ขอแก้ไข</span>',REVIEW_REQUIRED:'รอรีวิว'}[p.review] || 'ยังไม่มีรีวิว';
  const lead = p.reviews.at(-1);
  const thread = !p.threads.length ? '' : open.length
    ? `<details open><summary class="bad">● ${open.length} คอมเมนต์ยังไม่ resolve${fixed.length ? ` · resolve แล้ว ${fixed.length}` : ''}</summary><ul>${open.map(t => `<li><b>${esc(t.path)}</b> ${esc(t.text)}</li>`).join('')}</ul></details>`
    : `<div class="ok">✓ resolve ครบ ${fixed.length} คอมเมนต์ แจ้งหัวหน้าได้</div>`;
  return `<div class="pr ${p.state}">
    <div class="top">${prLink(p, true)}<span class="state ${p.state}">${p.state === 'MERGED' ? 'Merged ' + p.merged : p.state[0] + p.state.slice(1).toLowerCase()}</span></div>
    <div>${esc(p.title)}</div>
    <div class="row mono">${esc(p.branch)}</div>
    <div class="row">รีวิว: ${rv} · ${checks}</div>
    ${lead ? `<div class="lead"><b>${esc(lead.by)}</b> ${lead.at}: ${esc(lead.text)}</div>` : ''}
    ${thread}
    <div class="chips">${p.cards.filter(i => byId[i]).map(i => cardLink(byId[i], true)).join('')}</div></div>`;
};
$('prs').innerHTML = D.prs.filter(p => p.state !== 'CLOSED').sort((a, b) => b.n - a.n).map(prCard).join('');
const closed = D.prs.filter(p => p.state === 'CLOSED');
$('prs-closed').innerHTML = closed.map(prCard).join('');
$('closed-sum').textContent = `PR ที่ปิดไปแล้วโดยไม่ merge (${closed.length})`;

// fit the whole board into the panel, then draw edges in the board's own (unscaled) space
const board = $('board'), stage = $('stage');
let scale = 1;
function fit(){
  board.style.transform = 'none';
  const w = board.scrollWidth, h = board.scrollHeight;
  scale = Math.min(1.25, stage.clientWidth / w, stage.clientHeight / h);
  board.style.transform = `scale(${scale})`;
  drawDeps(w, h); applyFilter();
}
function box(el){
  const r = el.getBoundingClientRect(), o = board.getBoundingClientRect();
  const l = (r.left - o.left) / scale, t = (r.top - o.top) / scale, w = r.width / scale, h = r.height / scale;
  return {l, r:l + w, t, b:t + h, cy:t + h / 2};
}
function drawDeps(w, h){
  const svg = $('edges'); svg.setAttribute('width', w); svg.setAttribute('height', h);
  $('g-deps').innerHTML = D.cards.flatMap(c => c.deps.filter(d => byId[d]).map(d => {
    const a = box($('c-' + d)), b = box($('c-' + c.id)), ok = isDone(d), x1 = a.r, y1 = a.cy, x2 = b.l - 3, y2 = b.cy, mx = x1 + (x2 - x1) / 2;
    return `<path data-from="${d}" data-to="${c.id}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="var(${ok ? '--edge-ok' : '--edge-wait'})" stroke-width="2" ${ok ? '' : 'stroke-dasharray="5 5"'} marker-end="url(#${ok ? 'a-ok' : 'a-wait'})"/>`;
  })).join('');
}

// hover: highlight neighbours, show the card's PRs and last comment top-right; gone on leave
const peek = $('peek');
document.querySelectorAll('[data-card]').forEach(el => {
  const c = byId[el.dataset.card];
  el.addEventListener('click', e => { if (!e.target.closest('a')) open(c.url, '_blank'); });
  el.addEventListener('mouseenter', () => {
    const keep = new Set([el, ...[...c.deps, ...D.cards.filter(x => x.deps.includes(c.id)).map(x => x.id)].map(i => $('c-' + i)).filter(Boolean)]);
    document.querySelectorAll('.card').forEach(x => x.classList.toggle('dim', !keep.has(x)));
    document.querySelectorAll('#g-deps path').forEach(p => p.classList.toggle('dim', p.dataset.from !== c.id && p.dataset.to !== c.id));
    el.classList.add('hot');
    const lc = c.last_comment;
    peek.innerHTML = c.prs.map(n => prCard(prBy[n])).join('') +
      `<div class="note${c.lead_new ? ' new' : ''}"><h3>${c.id} · ${c.spec} ${c.lead_new ? '<span class="bad">● หัวหน้าตอบใหม่</span>' : ''}</h3>
       ${lc ? `<b>${esc(lc.by)}</b> ${lc.at}<br>${esc(lc.text)}` : '<span class="row">ยังไม่มีคอมเมนต์บนการ์ด</span>'}
       ${c.prs.length ? '' : '<div class="row" style="margin-top:4px">ยังไม่มี PR</div>'}</div>`;
    peek.hidden = false;
  });
  el.addEventListener('mouseleave', () => {
    document.querySelectorAll('.dim,.hot').forEach(x => x.classList.remove('dim', 'hot'));
    peek.hidden = true;
  });
});

// tabs (keys 1 / 2 switch too)
function show(tab){
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('clickup').hidden = tab !== 'clickup'; $('github').hidden = tab !== 'github';
  if (tab === 'clickup') fit();
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => show(b.dataset.tab));
addEventListener('keydown', e => { if (e.key === '1') show('clickup'); if (e.key === '2') show('github'); if (e.key === 'Escape') { filter = null; applyFilter(); } });
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
  if (b.dataset.f === 'gh') return show('github');
  filter = filter === b.dataset.f ? null : b.dataset.f;
  show('clickup'); applyFilter();
});
addEventListener('resize', fit); document.fonts?.ready.then(fit); fit();
$('theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
</script>
